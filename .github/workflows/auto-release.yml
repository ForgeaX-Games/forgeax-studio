name: Auto release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag-and-release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'auto/mirror-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "forgeax"
          git config user.email "forgeax@users.noreply.github.com"

      - name: Extract version from package.json
        id: ver
        run: |
          ver=$(node -p "require('./package.json').version")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify candidate-bound release-integrity evidence
        id: release-integrity
        if: steps.check.outputs.exists == 'false'
        env:
          RELEASE_INTEGRITY_CANDIDATE: ${{ runner.temp }}/release-candidate.json
          RELEASE_INTEGRITY_EXPECTED_TAG: v${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          : "${RELEASE_INTEGRITY_CANDIDATE:?release-integrity candidate evidence is required}"
          test -s "$RELEASE_INTEGRITY_CANDIDATE" || {
            echo "release-integrity candidate evidence is missing; tag and release mutation are suppressed"
            exit 3
          }
          node - "$RELEASE_INTEGRITY_CANDIDATE" "$RELEASE_INTEGRITY_EXPECTED_TAG" <<'NODE'
          const fs = require("node:fs");
          const [candidatePath, expectedTag] = process.argv.slice(2);
          const candidate = JSON.parse(fs.readFileSync(candidatePath, "utf8"));
          const expectedPermission = {
            repositories: ["ForgeaX-Games/forgeax-studio"],
            refs: ["refs/heads/main"],
            operations: ["contents:write", "release:write"],
          };
          const validDigest = typeof candidate.subjectDigest === "string" && /^[0-9a-f]{64}$/.test(candidate.subjectDigest);
          const samePermission = JSON.stringify(candidate.permissionObservation) === JSON.stringify(expectedPermission);
          if (
            !candidate.candidateId ||
            candidate.tag !== expectedTag ||
            candidate.target !== "ForgeaX-Games/forgeax-studio" ||
            candidate.ref !== "refs/heads/main" ||
            !validDigest ||
            candidate.platformTrust !== "passed" ||
            candidate.publisher !== "public-artifact-publisher" ||
            candidate.externalOutcome !== "verified" ||
            candidate.mutation !== "permitted" ||
            !candidate.recoveryJournal ||
            !samePermission
          ) {
            console.error("release-integrity candidate is missing verified candidate-bound evidence");
            process.exit(3);
          }
          console.log(`release-integrity candidate=${candidate.candidateId} target=${candidate.target} ref=${candidate.ref} permission=observed`);
          NODE
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          ver="${{ steps.ver.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            # Extract the section for this version (between ## v<ver> and the next ## v)
            notes=$(awk "/^## v${ver//./\\.}/{found=1; next} /^## v[0-9]/{if(found) exit} found{print}" CHANGELOG.md)
          fi
          if [ -z "$notes" ]; then
            notes="Release v${ver} — ForgeaX Studio"
          fi
          # Write to file to avoid escaping issues
          printf '%s\n' "$notes" > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false' && steps.release-integrity.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -a "${{ steps.ver.outputs.tag }}" -m "ForgeaX Studio ${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "ForgeaX Studio ${{ steps.ver.outputs.tag }}" \
            --notes-file /tmp/release-notes.md
